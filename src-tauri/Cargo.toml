[package]
name = "lymbe-desktop"
version = "0.2.0"
description = "Lymbe AI Desktop"
authors = ["Lymbe AI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lymbe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# 2.2 ist die Untergrenze wegen TrayIconBuilder::show_menu_on_left_click —
# davor hiess die Methode menu_on_left_click.
#
# macos-private-api gehoert zwingend zu "macOSPrivateApi": true in
# tauri.conf.json — ohne das Feature bricht das Build-Script ab. Noetig ist es
# fuer das durchsichtige Fenster des schwebenden Symbols. Apple laesst Apps mit
# privaten APIs nicht in den App Store; fuer den Direktvertrieb ueber eigene
# Installer, wie hier, ist es unproblematisch.
tauri = { version = "2.2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-store = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Nur auf dem Desktop verfuegbar — global-shortcut, autostart und
# single-instance haben keine mobilen Gegenstuecke.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-single-instance = "2.0"

[features]
# Default `custom-protocol` is enabled by Tauri's bundling logic in release
# builds — required so the asset:// scheme works in the packaged app.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
